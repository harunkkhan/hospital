[project]
name = "hospital-analysis"
version = "0.1.0"
description = "Reads the EventLog: KPI fold, wait decomposition, bottleneck detection, utilization, and the paired baseline-vs-optimized comparison."
requires-python = ">=3.13,<3.14"
dependencies = [
    "hospital-core",
    "numpy",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hospital"]

[tool.uv.sources]
hospital-core = { workspace = true }
