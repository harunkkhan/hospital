[project]
name = "hospital-sim"
version = "0.1.0"
description = "The SimPy digital twin: physics (world/executor/service-times/resources), policies, and the experiment composition root. Composes core, solver, data, analysis."
requires-python = ">=3.13,<3.14"
dependencies = [
    "hospital-core",
    "hospital-solver",
    "hospital-data",
    "hospital-analysis",
    "simpy",
    "numpy",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hospital"]

[tool.uv.sources]
hospital-core = { workspace = true }
hospital-solver = { workspace = true }
hospital-data = { workspace = true }
hospital-analysis = { workspace = true }
