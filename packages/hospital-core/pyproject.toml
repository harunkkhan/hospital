[project]
name = "hospital-core"
version = "0.1.0"
description = "Shared domain model, contracts, graph, RNG/CRN, events, decision seam, validation, and KPI contract for the hospital ER simulator."
requires-python = ">=3.13,<3.14"
dependencies = [
    "pydantic>=2",
    "numpy",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# Implicit namespace package: ship src/hospital/core without a top-level
# src/hospital/__init__.py so the `hospital` namespace spans distributions.
packages = ["src/hospital"]
