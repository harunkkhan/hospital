[project]
name = "hospital-solver"
version = "0.1.0"
description = "Pure optimization core: Solver Protocol + registry, routing oracle, CP-SAT placement, sequencing, dispatch, turnaround/discharge levers."
requires-python = ">=3.13,<3.14"
dependencies = [
    "hospital-core",
    "ortools",
    "numpy",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hospital"]

[tool.uv.sources]
hospital-core = { workspace = true }
