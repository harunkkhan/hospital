[project]
name = "hospital-forecast"
version = "0.1.0"
description = "Predict-then-optimize (M3): arrival-intensity/service-time/LOS models, deterioration classifier, retraining loop, and the solver prediction adapter. Depends on core and data only."
requires-python = ">=3.13,<3.14"
dependencies = [
    "hospital-core",
    "hospital-data",
    "scikit-learn",
    "joblib",
    "lightgbm",
    "numpy",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hospital"]

[tool.uv.sources]
hospital-core = { workspace = true }
hospital-data = { workspace = true }
