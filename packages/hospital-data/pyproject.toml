[project]
name = "hospital-data"
version = "0.1.0"
description = "Deterministic generators: ER floor layout + route graph and the patient/workload stream for the hospital simulator."
requires-python = ">=3.13,<3.14"
dependencies = [
    "hospital-core",
    "pyyaml",
    "numpy",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hospital"]

[tool.uv.sources]
hospital-core = { workspace = true }
