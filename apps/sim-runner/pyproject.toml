[project]
name = "hospital-sim-runner"
version = "0.1.0"
description = "Headless CLI (M1): `hospital-sim run --scenario ...` composes the M1 stack (core, data, solver, analysis, sim) to produce metrics.json."
requires-python = ">=3.13,<3.14"
dependencies = [
    "hospital-core",
    "hospital-data",
    "hospital-solver",
    "hospital-analysis",
    "hospital-sim",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hospital"]

[tool.uv.sources]
hospital-core = { workspace = true }
hospital-data = { workspace = true }
hospital-solver = { workspace = true }
hospital-analysis = { workspace = true }
hospital-sim = { workspace = true }
