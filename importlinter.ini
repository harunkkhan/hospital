; import-linter dependency-direction contracts.
;
; Encodes the strict downward dependency graph (docs/plan/08 §6):
;     core     -> (nothing)
;     data     -> core
;     solver   -> core
;     analysis -> core
;     sim      -> core, solver, data, analysis
;     forecast -> core, data
;     apps/*   -> the packages they compose
;
; Each package gets one `forbidden` contract listing exactly the in-repo
; packages it may NOT import. This is more precise than a single `layers`
; contract because the graph is a DAG, not a linear stack: `data`, `solver`,
; and `analysis` are independent siblings (none may import another), and
; `forecast` depends on `data` but must never reach `solver`/`analysis`/`sim`
; — a distinction plain layering cannot express.

[importlinter]
root_packages =
    hospital.core
    hospital.data
    hospital.solver
    hospital.analysis
    hospital.sim
    hospital.forecast
    hospital.sim_runner
include_external_packages = False

[importlinter:contract:core]
name = core depends on nothing in-repo
type = forbidden
source_modules =
    hospital.core
forbidden_modules =
    hospital.data
    hospital.solver
    hospital.analysis
    hospital.sim
    hospital.forecast
    hospital.sim_runner

[importlinter:contract:data]
name = data -> core only
type = forbidden
source_modules =
    hospital.data
forbidden_modules =
    hospital.solver
    hospital.analysis
    hospital.sim
    hospital.forecast
    hospital.sim_runner

[importlinter:contract:solver]
name = solver -> core only
type = forbidden
source_modules =
    hospital.solver
forbidden_modules =
    hospital.data
    hospital.analysis
    hospital.sim
    hospital.forecast
    hospital.sim_runner

[importlinter:contract:analysis]
name = analysis -> core only
type = forbidden
source_modules =
    hospital.analysis
forbidden_modules =
    hospital.data
    hospital.solver
    hospital.sim
    hospital.forecast
    hospital.sim_runner

[importlinter:contract:sim]
name = sim -> core, solver, data, analysis
type = forbidden
source_modules =
    hospital.sim
forbidden_modules =
    hospital.forecast
    hospital.sim_runner

[importlinter:contract:forecast]
name = forecast -> core, data
type = forbidden
source_modules =
    hospital.forecast
forbidden_modules =
    hospital.solver
    hospital.analysis
    hospital.sim
    hospital.sim_runner

[importlinter:contract:sim-runner]
name = sim-runner -> core, data, solver, analysis, sim
type = forbidden
source_modules =
    hospital.sim_runner
forbidden_modules =
    hospital.forecast
